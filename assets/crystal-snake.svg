<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" role="img" aria-label="Crystal blue snake with a glowing green orb on a liquid-glass grid">
<title>Crystal Snake</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020611"/><stop offset=".52" stop-color="#0b1c36"/><stop offset="1" stop-color="#030914"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8dcff" stop-opacity=".13"/><stop offset="1" stop-color="#6aaeff" stop-opacity=".025"/></linearGradient>
  <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8fbff"/><stop offset=".3" stop-color="#9be7ff"/><stop offset=".68" stop-color="#48b8ff"/><stop offset="1" stop-color="#477cff"/></linearGradient>
  <radialGradient id="head" cx=".3" cy=".22" r=".85"><stop stop-color="#fff"/><stop offset=".3" stop-color="#c9f5ff"/><stop offset=".72" stop-color="#54c4ff"/><stop offset="1" stop-color="#2465e8"/></radialGradient>
  <radialGradient id="food" cx=".3" cy=".25" r=".9"><stop stop-color="#f2fff7"/><stop offset=".38" stop-color="#8dffb9"/><stop offset=".75" stop-color="#32ef83"/><stop offset="1" stop-color="#07984e"/></radialGradient>
  <radialGradient id="blueGlow"><stop stop-color="#3a91ff" stop-opacity=".25"/><stop offset="1" stop-color="#3a91ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="greenGlow"><stop stop-color="#35ff91" stop-opacity=".5"/><stop offset="1" stop-color="#35ff91" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><rect x="1.5" y="1.5" width="23" height="23" rx="6" fill="url(#glass)" stroke="#b6d8ff" stroke-opacity=".075" stroke-width=".8"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<rect width="800" height="306" rx="28" fill="url(#bg)"/>
<circle cx="180" cy="82" r="190" fill="url(#blueGlow)"/>
<circle cx="660" cy="226" r="185" fill="url(#blueGlow)" opacity=".55"/>
<rect x="25" y="25" width="750" height="256" rx="22" fill="#071326" fill-opacity=".76" stroke="#c4e4ff" stroke-opacity=".18"/>
<rect x="36" y="36" width="728" height="234" rx="16" fill="url(#grid)"/>
<path d="M36 62H764M36 244H764" stroke="#d7edff" stroke-opacity=".035"/>
<!-- Snake body: a translucent glass capsule that loops around the playfield. -->
<g transform="translate(210 90)">
  <g>
    <rect x="-150" y="-15" width="150" height="30" rx="15" fill="#318cff" opacity=".55" filter="url(#glow)"/>
    <rect x="-145" y="-9.5" width="139" height="19" rx="9.5" fill="url(#snake)" stroke="#e2faff" stroke-opacity=".6" stroke-width="1"/>
    <path d="M-133 -5H-17" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#318cff" opacity=".7" filter="url(#smallGlow)"/>
    <circle cx="0" cy="0" r="10.8" fill="url(#head)" stroke="#e7fbff" stroke-width="1.2"/>
    <circle cx="4" cy="-3.2" r="1.65" fill="#092044"/><circle cx="4" cy="3.2" r="1.65" fill="#092044"/>
    <circle cx="4.5" cy="-3.7" r=".55" fill="#fff"/><circle cx="4.5" cy="2.7" r=".55" fill="#fff"/>
    <animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M0 0H430Q470 0 470 40V110Q470 150 430 150H0Q-40 150 -40 110V40Q-40 0 0 0"/>
  </g>
</g>
<!-- Glowing food orb: a looping sequence of varied spawn locations. -->
<g transform="translate(470 92)">
  <circle r="22" fill="url(#greenGlow)" filter="url(#glow)"/>
  <circle r="7.4" fill="url(#food)" stroke="#d7ffe6" stroke-opacity=".85" stroke-width="1"/>
  <circle cx="-2.1" cy="-2.7" r="1.8" fill="#fff" opacity=".92"/>
  <circle r="11" fill="none" stroke="#8dffb9" stroke-width="1.15"><animate attributeName="r" values="8;17;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;0;.75" dur="1.6s" repeatCount="indefinite"/></circle>
  <animateTransform attributeName="transform" type="translate" values="470 92;685 145;518 232;260 232;135 145;470 92" keyTimes="0;.2;.4;.6;.8;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/>
</g>
<rect x="25.5" y="25.5" width="749" height="255" rx="21.5" fill="none" stroke="url(#snake)" stroke-opacity=".15"/>
<path d="M55 27H745" stroke="#fff" stroke-opacity=".08"/>
</svg>